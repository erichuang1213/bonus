<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雙人配對大廳</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top, #1e293b 0%, #0f172a 45%, #020617 100%);
      color: #e2e8f0;
      font-family: "Microsoft JhengHei", sans-serif;
    }

    .card {
      width: min(92vw, 560px);
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(148, 163, 184, 0.22);
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
    }

    h1 {
      margin: 0 0 10px;
      font-size: 30px;
    }

    .desc {
      margin: 0 0 20px;
      color: #94a3b8;
      line-height: 1.7;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
      color: #cbd5e1;
    }

    input, button {
      width: 100%;
      border-radius: 14px;
      padding: 13px 14px;
      font-size: 16px;
    }

    input {
      border: 1px solid #475569;
      background: #0b1220;
      color: #f8fafc;
    }

    .role-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-top: 8px;
    }

    .role-option {
      min-height: 104px;
      margin: 0;
      padding: 12px;
      border: 1px solid #334155;
      border-radius: 14px;
      background: #0b1220;
      color: #e2e8f0;
      text-align: left;
    }

    .role-option.is-selected {
      border-color: var(--role-color);
      box-shadow: 0 0 0 2px color-mix(in srgb, var(--role-color) 35%, transparent), 0 0 18px color-mix(in srgb, var(--role-color) 28%, transparent);
    }

    .role-option strong, .role-option small { display: block; }
    .role-option small { margin-top: 5px; color: #94a3b8; line-height: 1.45; }

    .role-detail {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid #334155;
      border-left: 4px solid var(--role-color, #22c55e);
      border-radius: 14px;
      background: rgba(2, 6, 23, 0.75);
    }

    .role-detail h2 { margin: 0 0 10px; font-size: 20px; color: var(--role-color, #f8fafc); }
    .role-detail-grid { display: grid; grid-template-columns: 92px 1fr; gap: 8px 12px; font-size: 14px; line-height: 1.55; }
    .role-detail-grid dt { color: #94a3b8; font-weight: 700; }
    .role-detail-grid dd { margin: 0; color: #e2e8f0; }

    @media (max-width: 430px) {
      .card { padding: 20px; }
      .role-grid { grid-template-columns: 1fr; }
    }

    button {
      margin-top: 22px;
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.05);
    }

    #status {
      margin-top: 18px;
      min-height: 24px;
      color: #facc15;
      line-height: 1.7;
      white-space: pre-line;
    }

    .tip {
      margin-top: 14px;
      color: #94a3b8;
      font-size: 14px;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎮 雙人配對大廳</h1>
    <p class="desc">
      先選擇名字與角色，再開始配對。<br />
      配對成功後角色會鎖定，直接進入對戰。
    </p>

    <label for="playerName">你的名字</label>
    <input id="playerName" value="玩家1" />

    <label>選擇角色（配對後鎖定）</label>
    <div class="role-grid" id="roleGrid" aria-label="角色選擇"></div>
    <section class="role-detail" id="roleDetail" aria-live="polite"></section>

    <button id="matchBtn">開始配對</button>

    <div id="status">尚未開始配對</div>

    <div class="tip">
      請用兩個分頁或兩台裝置一起測試。<br />
      角色送出後不可更換，請確認再開始配對。
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const playerNameInput = document.getElementById("playerName");
    const matchBtn = document.getElementById("matchBtn");
    const statusEl = document.getElementById("status");
    const roleGrid = document.getElementById("roleGrid");
    const roleDetail = document.getElementById("roleDetail");

    const roles = [
      { id: "speeder", name: "⚡ 疾風球", desc: "基礎碰撞型角色", color: "#ff4757", attack: "碰撞傷害 50", passive: "目前沒有專屬被動。", ultimate: "目前沒有專屬大招。" },
      { id: "tank", name: "🛡️ 鐵壁球", desc: "基礎碰撞型角色", color: "#2ed573", attack: "碰撞傷害 50", passive: "目前沒有專屬被動。", ultimate: "目前沒有專屬大招。" },
      { id: "frenzy", name: "🗡️ 狂暴", desc: "反傷、偷速與暴走", color: "#ff3333", attack: "碰撞傷害 50；劍砍傷害 20。", passive: "每次受擊反傷 2%，並回復 5 能量；劍砍可累積偷速與減傷層數。", ultimate: "滿能量暴走 3 秒：速度 50、減傷 40%。" },
      { id: "magma", name: "🌋 熔岩巨獸", desc: "岩漿痕跡與火山封鎖", color: "#ee5253", hp: 2400, speed: 9.2, attack: "碰撞傷害 35 + 灼燒爆發；岩漿傷害 12~20。", passive: "移動留下 3.5 秒岩漿，最多疊加 5 層灼燒。", ultimate: "火山封鎖持續 3 秒；結束時依灼燒層數爆炸，最高 100 傷害。" },
      { id: "nova", name: "🌠 幻星", desc: "引力控制與黑洞", color: "#5f27cd", attack: "碰撞傷害 50；黑洞傷害 25。", passive: "引力會拉扯附近的對手，碰撞帶有強力斥力。", ultimate: "在場中央生成黑洞，吸入並持續傷害對手。" },
      { id: "clone", name: "👥 影分身", desc: "飛彈、分身與時間靜止", color: "#ff6b9d", attack: "飛彈傷害 25；大型飛彈傷害 500。", passive: "自動發射飛彈；分身單次碰撞造成 5 傷害。", ultimate: "召喚分身；分身足夠時啟動時間靜止領域與大型飛彈。" },
    ];
    let selectedRole = sessionStorage.getItem("selectedQueueRole") || "speeder";

    function renderRoleOptions() {
      roleGrid.innerHTML = "";
      roles.forEach((role) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = `role-option${role.id === selectedRole ? " is-selected" : ""}`;
        button.setAttribute("aria-pressed", String(role.id === selectedRole));
        button.style.setProperty("--role-color", role.color);
        button.innerHTML = `<strong>${role.name}</strong><small>${role.desc}</small>`;
        button.addEventListener("click", () => {
          if (matchBtn.disabled) return;
          selectedRole = role.id;
          sessionStorage.setItem("selectedQueueRole", selectedRole);
          renderRoleOptions();
        });
        roleGrid.appendChild(button);
      });
      const role = roles.find((item) => item.id === selectedRole) || roles[0];
      roleDetail.style.setProperty("--role-color", role.color);
      roleDetail.innerHTML = `<h2>${role.name}：基本資料</h2><dl class="role-detail-grid"><dt>基礎數值</dt><dd>生命 ${role.hp || 2000}／基礎速度 ${role.speed || 12.2}／半徑 70</dd><dt>主要攻擊</dt><dd>${role.attack}</dd><dt>被動</dt><dd>${role.passive}</dd><dt>大招</dt><dd>${role.ultimate}</dd><dt>選擇狀態</dt><dd>目前已選擇；開始配對後將鎖定。</dd></dl>`;
    }
    renderRoleOptions();

    let playerKey = sessionStorage.getItem("playerKey") || "";

    matchBtn.addEventListener("click", () => {
      const payload = {
        name: playerNameInput.value.trim() || "玩家",
        role: selectedRole,
        playerKey: playerKey || undefined,
      };

      statusEl.textContent = "正在配對中...";
      matchBtn.disabled = true;
      socket.emit("joinQueue", payload);
    });

    socket.on("queueJoined", (data) => {
      statusEl.textContent = data.message || "已進入配對佇列";
      if (data.playerKey) {
        playerKey = data.playerKey;
        sessionStorage.setItem("playerKey", playerKey);
      }
    });

    socket.on("gameStart", (data) => {
      if (data.me && data.me.playerKey) {
        sessionStorage.setItem("playerKey", data.me.playerKey);
      }

      sessionStorage.setItem("bounceRoomData", JSON.stringify(data));
      statusEl.textContent = "配對成功，正在進入對戰頁...";

      setTimeout(() => {
        window.location.href = "/bounce.html";
      }, 500);
    });

    socket.on("roomError", (data) => {
      statusEl.textContent = data.message || "房間發生錯誤";
      matchBtn.disabled = false;
    });

    socket.on("disconnect", () => {
      if (statusEl.textContent.includes("正在配對")) {
        statusEl.textContent = "連線中斷，請重新整理後再試一次。";
        matchBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
